name: Integracion Continua BookTracker

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

    defaults:
      run:
        working-directory: src/book-tracker

    steps:
      - name: 1. Descargar Codigo Fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Compilacion y Pruebas Unitarias (JaCoCo Coverage)
        run: mvn clean verify

      - name: 4. Analisis de Calidad de Codigo (SonarCloud)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=adrianawzw_book-tracker \
            -Dsonar.organization=adrianawzw \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: 5. Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "6. Empaquetado: Construir Imagen Docker Multi-Stage"
        run: docker build -t adrianawzw/book-tracker:latest .

      - name: 7. Escaneo de Vulnerabilidades de Imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'adrianawzw/book-tracker:latest'
          format: 'table'
          exit-code: '0'   # <-- Cambiado de '1' a '0'
          severity: 'HIGH,CRITICAL'         

      - name: "8. Despliegue: Subir Imagen a Docker Hub"
        run: docker push adrianawzw/book-tracker:latest
